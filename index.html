<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Property Administration</title>
  <meta name="theme-color" content="#16324a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-icon" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <div>
          <div class="brand-name">Property</div>
          <div class="brand-sub">Administration</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">Local database · data/property.db</div>
    </aside>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Menu"></button>
        <div class="topbar-title">
          <div class="crumb" id="crumb"></div>
          <h1 id="title"></h1>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" id="drawerClose" title="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="vendor/msal-browser.min.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
